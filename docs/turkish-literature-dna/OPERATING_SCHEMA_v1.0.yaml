schema_id: deja_vu_3.turkish_literature_dna
version: "1.0.0"
language: de
status: integrated_foundation_validation_continues

architecture:
  hierarchy: [MASTER, MODULE, DNA, PRODUCTION]
  allowed_library_extensions: [process_dna, literature_dna, human_dna, symbol_dna, culture_dna]
  new_library_types_allowed: false
  core_architecture_mutable: false

source_governance:
  evidence_classes:
    A1: primary_text_facsimile_or_critical_edition
    A2: scholarly_edited_text
    B1: academic_reference_catalogue_or_monograph
    B2: scholarly_interpretation
    C1: documented_oral_variant
    C2: collection_without_critical_apparatus
    D: anonymous_dump_quote_card_or_repost
  separate_layers: [fact, interpretation, abstraction, transformation]
  forbidden:
    - fabricated_quote_title_date_edition_or_attribution
    - silent_modernization_translation_shortening_or_correction
    - fixed_authorship_from_theme_or_style
    - public_repository_equals_public_domain
    - living_author_imitation
    - author_narrator_character_collapse
    - sacred_or_minorized_material_as_decoration

