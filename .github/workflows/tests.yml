name: Agency Swarm Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Run tests
        run: python -m pytest -q

  live-github-smoke:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Live GitHub Research smoke test
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from agency.research.sources import GitHubPublicSource

          findings = GitHubPublicSource().inspect_repository("VRSEN/agency-swarm")
          assert findings, "No live GitHub findings returned"
          assert any("VRSEN/agency-swarm" in f.claim for f in findings)
          assert all(f.source.startswith("https://github.com/") for f in findings)
          print(f"LIVE_RESEARCH_OK findings={len(findings)}")
          for finding in findings:
              print(f"[{finding.evidence_level}/{finding.relevance}] {finding.claim}")
          PY

  live-web-smoke:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install live research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[live]'

      - name: Live Web Research smoke test
        if: env.OPENAI_API_KEY != ''
        run: |
          python - <<'PY'
          from agency.agents.research import ResearchAgent
          from agency.validation.schemas import ResearchFinding, ResearchResult

          initial = ResearchResult(
              status="COMPLETED",
              findings=[ResearchFinding(
                  claim="VRSEN/agency-swarm requires independent web verification",
                  source="https://github.com/VRSEN/agency-swarm",
                  evidence_level="E4",
                  relevance="R3",
                  confidence=0.50,
              )],
              confidence=0.50,
          )
          result = ResearchAgent().augment_with_web("VRSEN/agency-swarm", initial)
          assert len(result.findings) > 1, "Web research returned no additional evidence"
          assert any(f.source != "https://github.com/VRSEN/agency-swarm" for f in result.findings)
          print(f"LIVE_WEB_RESEARCH_OK findings={len(result.findings)} confidence={result.confidence}")
          PY

      - name: Report missing web credential
        if: env.OPENAI_API_KEY == ''
        run: echo "LIVE_WEB_RESEARCH_SKIPPED OPENAI_API_KEY secret is not configured"
